name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw verify

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/surefire-reports/TEST-*.xml'
          check_name: Surefire Tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload surefire HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/reports/surefire.html
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  # deploy:
  #   needs: [test, security]
  #   if: github.ref == 'refs/heads/master' && github.event_name == 'push'
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     # Configure this job for your target platform:
  #     # - Render:  curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
  #     # - Fly.io:  flyctl deploy --remote-only
  #     # - EC2:     scp jar + ssh systemctl restart
  #     # - ECS:     aws ecs update-service ...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-${{ hashFiles('pom.xml') }}
          restore-keys: owasp-

      - name: OWASP dependency check
        run: |
          ./mvnw org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=10 \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check/dependency-check-report.html
          retention-days: 14

